<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <meta name="description" content="Cybercrime Reporting & Awareness Portal" />
  <title>Cybercrime Reporting & Awareness Portal</title>
  <style>
:root {
  --bg: #f5f5f7;
  --surface: rgba(255,255,255,.82);
  --surface-solid: #fff;
  --surface-soft: rgba(255,255,255,.58);
  --text: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(0,0,0,.08);
  --accent: #007aff;
  --accent-soft: rgba(0,122,255,.10);
  --green: #34c759;
  --orange: #ff9f0a;
  --red: #ff3b30;
  --shadow: 0 18px 50px rgba(0,0,0,.08), 0 3px 10px rgba(0,0,0,.04);
  --shadow-sm: 0 7px 25px rgba(0,0,0,.06);
  --radius-xl: 28px;
  --radius-lg: 22px;
  --radius-md: 16px;
  --radius-sm: 12px;
  --nav-space: 300px;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif; background: var(--bg); color: var(--text); }
body { overflow-x: hidden; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .55; }
::selection { background: rgba(0,122,255,.18); }

.app { min-height: 100vh; }
.shell { min-height: 100vh; position: relative; }
.shell::before { content:""; position:fixed; inset:-10% -20%; z-index:-2; background: radial-gradient(circle at 15% 15%, rgba(0,122,255,.08), transparent 28%), radial-gradient(circle at 80% 20%, rgba(88,86,214,.08), transparent 30%), radial-gradient(circle at 55% 85%, rgba(52,199,89,.06), transparent 24%); pointer-events:none; }
.shell::after { content:""; position:fixed; inset:0; z-index:-1; background: linear-gradient(180deg, rgba(255,255,255,.25), transparent 30%); pointer-events:none; }

.view { max-width: 1400px; margin: 0 auto; padding: 40px 40px 90px calc(var(--nav-space) + 40px); }
.topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom: 30px; }
.eyebrow { color: var(--muted); font-size: 13px; font-weight: 600; letter-spacing: .02em; }
h1,h2,h3,h4,p { margin:0; }
h1 { font-size: clamp(36px, 4vw, 58px); line-height: 1.02; letter-spacing: -.04em; }
h2 { font-size: clamp(26px, 2.7vw, 38px); letter-spacing: -.03em; }
h3 { font-size: 20px; letter-spacing: -.02em; }
.lead { color: var(--muted); font-size: 18px; line-height:1.55; max-width: 760px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

 .nav-dock { position:fixed; left:20px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:10px; align-items:stretch; z-index:80; }
.nav-pill { display:flex; flex-direction:column; gap:6px; padding:9px; min-width:260px; background:rgba(255,255,255,.72); border:1px solid rgba(255,255,255,.72); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border-radius:28px; box-shadow:var(--shadow); }
.nav-item { position:relative; width:100%; min-height:56px; padding:0 16px; border:0; background:transparent; color:#5f6368; border-radius:20px; display:flex; align-items:center; justify-content:flex-start; gap:12px; transition: transform .2s ease, background .2s ease, color .2s ease; }
.nav-item:hover { transform:translateX(2px); color:var(--text); background:rgba(0,0,0,.05); }
.nav-item.active { color:var(--accent); background:#e5e5ea; }
.nav-icon { width:23px; height:23px; display:block; flex:none; }
.gear-icon { display:grid; place-items:center; width:24px; height:24px; font-size:20px; line-height:1; flex:none; }
.nav-text { display:block; font-size:14px; line-height:1; font-weight:600; text-align:left; white-space:nowrap; }
.nav-label { display:none; }
.search-fab { width:56px; height:56px; margin:0 auto; border:1px solid rgba(255,255,255,.72); border-radius:50%; background:rgba(255,255,255,.72); backdrop-filter:blur(24px) saturate(180%); -webkit-backdrop-filter:blur(24px) saturate(180%); box-shadow:var(--shadow); color:var(--text); display:grid; place-items:center; position:relative; }
.search-fab:hover { transform:translateY(-2px); }
.search-fab .nav-icon { width:25px; height:25px; }
.search-caption { display:none; }
.mobile-nav { display:none; }

.nav-item { flex-direction:row; justify-content:flex-start; gap:12px; width:100%; height:56px; border-radius:22px; }
.nav-item .nav-icon { width:24px; height:24px; }
.nav-text { display:block; font-size:14px; line-height:1; font-weight:600; text-align:left; white-space:nowrap; }
.nav-label { display:none; }
.search-fab { flex-direction:row; gap:0; }
.search-fab .nav-icon { width:28px; height:28px; }
.search-caption { display:none; }
.topbar-left { display:flex; align-items:flex-start; gap:12px; min-width:0; }
.back-btn { display:inline-flex; align-items:center; gap:6px; min-height:38px; padding:0 12px 0 9px; border:1px solid var(--line); border-radius:999px; background:var(--surface); color:var(--text); box-shadow:var(--shadow-sm); font-weight:700; cursor:pointer; margin-top:2px; }
.back-btn .nav-icon { width:18px; height:18px; }
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0;} input[type=number]{-moz-appearance:textfield;}
.full-width-action{width:100%;justify-content:flex-start;}


.hero { display:grid; grid-template-columns: 1.3fr .7fr; gap:22px; margin-bottom:30px; }
.hero-main, .hero-side { border-radius:var(--radius-xl); background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
.hero-main { padding:40px; min-height:320px; display:flex; flex-direction:column; justify-content:flex-end; }
.hero-main .accent-line { width:58px; height:6px; border-radius:999px; background:var(--accent); margin-bottom:20px; }
.hero-side { padding:28px; display:flex; flex-direction:column; justify-content:space-between; gap:18px; }
.hero-side .mini-stat { display:flex; justify-content:space-between; align-items:flex-end; padding:16px 0; border-bottom:1px solid var(--line); }
.hero-side .mini-stat:last-child { border-bottom:0; }
.mini-stat strong { font-size: 36px; letter-spacing:-.04em; }

.card-grid { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:18px; }
.card { background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm); border-radius:var(--radius-lg); padding:26px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
.action-card { min-height:250px; display:flex; flex-direction:column; justify-content:space-between; transition:transform .2s ease, box-shadow .2s ease; }
.action-card:hover { transform:translateY(-3px); box-shadow:var(--shadow); }
.action-card .icon-wrap { width:46px; height:46px; border-radius:16px; background:var(--accent-soft); display:grid; place-items:center; color:var(--accent); margin-bottom:18px; }
.action-card h3 { margin-bottom:8px; }
.action-card p { color:var(--muted); line-height:1.5; }
.card-link { border:0; background:transparent; padding:0; color:var(--accent); font-weight:600; text-align:left; }

.section { margin-top:30px; }
.section-head { display:flex; justify-content:space-between; align-items:flex-end; gap:16px; margin-bottom:16px; }
.grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.grid-3 { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
.grid-4 { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:16px; }

.btn { border:0; border-radius:14px; padding:12px 16px; font-weight:600; transition:.18s ease; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary { background:var(--accent); color:#fff; box-shadow:0 8px 18px rgba(0,122,255,.2); }
.btn-primary:hover { filter:brightness(.97); transform:translateY(-1px); }
.btn-secondary { background:rgba(0,0,0,.055); color:var(--text); }
.btn-secondary:hover { background:rgba(0,0,0,.08); }
.btn-danger { background:rgba(255,59,48,.10); color:#b42318; }
.btn-ghost { background:transparent; color:var(--muted); }
.btn-ghost:hover { background:rgba(0,0,0,.04); color:var(--text); }
.btn-row { display:flex; gap:10px; flex-wrap:wrap; }

.form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
.field { display:flex; flex-direction:column; gap:7px; }
.field.full { grid-column:1 / -1; }
label { font-size:13px; color:var(--muted); font-weight:600; }
input, select, textarea { width:100%; border:1px solid var(--line); background:rgba(255,255,255,.78); color:var(--text); border-radius:14px; padding:13px 14px; outline:none; transition:border .15s ease, box-shadow .15s ease; }
textarea { min-height:120px; resize:vertical; }
input:focus, select:focus, textarea:focus { border-color:rgba(0,122,255,.45); box-shadow:0 0 0 4px rgba(0,122,255,.10); }
.helper { color:var(--muted); font-size:12px; line-height:1.45; }

.badge { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:6px 10px; font-size:12px; font-weight:700; background:rgba(0,0,0,.06); }
.badge.green { background:rgba(52,199,89,.13); color:#17853f; }
.badge.blue { background:rgba(0,122,255,.11); color:#0b66c3; }
.badge.orange { background:rgba(255,159,10,.13); color:#a15f00; }
.badge.red { background:rgba(255,59,48,.11); color:#b42318; }

.table-wrap { overflow:auto; border-radius:16px; border:1px solid var(--line); }
table { width:100%; border-collapse:collapse; min-width:700px; }
th,td { padding:13px 14px; text-align:left; border-bottom:1px solid var(--line); }
th { font-size:12px; color:var(--muted); font-weight:700; background:rgba(0,0,0,.02); }
td { font-size:13px; }
tr:last-child td { border-bottom:0; }

.timeline { position:relative; margin:14px 0 0 8px; padding-left:26px; }
.timeline::before { content:""; position:absolute; left:7px; top:8px; bottom:8px; width:2px; background:rgba(0,0,0,.08); }
.timeline-item { position:relative; padding:0 0 22px; }
.timeline-dot { position:absolute; left:-26px; top:4px; width:16px; height:16px; border-radius:50%; background:#d2d2d7; border:4px solid var(--surface-solid); box-shadow:0 0 0 1px rgba(0,0,0,.08); }
.timeline-item.current .timeline-dot { background:var(--accent); box-shadow:0 0 0 4px rgba(0,122,255,.12); }
.timeline-item.done .timeline-dot { background:var(--green); }
.timeline-title { font-weight:700; }
.timeline-meta { color:var(--muted); font-size:12px; margin-top:4px; }

.modal-backdrop { position:fixed; inset:0; background:rgba(0,0,0,.35); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); z-index:200; display:grid; place-items:center; padding:20px; }
.modal { width:min(980px, 100%); max-height:min(88vh, 920px); overflow:auto; background:rgba(255,255,255,.92); border:1px solid rgba(255,255,255,.75); box-shadow:0 30px 90px rgba(0,0,0,.22); border-radius:30px; }
.modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:22px 24px; border-bottom:1px solid var(--line); position:sticky; top:0; background:rgba(255,255,255,.92); backdrop-filter:blur(18px); z-index:1; }
.modal-body { padding:24px; }
.modal-close { width:40px; height:40px; border:0; border-radius:50%; background:rgba(0,0,0,.05); display:grid; place-items:center; }
.search-layout { display:grid; grid-template-columns: 1fr 1.4fr; gap:14px; }
.search-box, .search-results { border:1px solid var(--line); background:rgba(248,248,250,.86); border-radius:22px; padding:18px; }
.search-results { min-height:300px; }
.search-result { width:100%; text-align:left; border:0; background:var(--surface-solid); border-radius:16px; padding:16px; margin-bottom:10px; box-shadow:var(--shadow-sm); }
.search-result:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
.search-result:last-child { margin-bottom:0; }
.search-result .title { font-weight:700; margin-bottom:5px; }
.search-result .desc { color:var(--muted); font-size:13px; line-height:1.45; }

.quiz-option { width:100%; text-align:left; border:1px solid var(--line); background:rgba(255,255,255,.78); padding:13px 15px; border-radius:14px; margin-top:9px; }
.quiz-option.selected { border-color:rgba(0,122,255,.4); background:var(--accent-soft); }
.quiz-option.correct { border-color:rgba(52,199,89,.42); background:rgba(52,199,89,.11); }
.quiz-option.wrong { border-color:rgba(255,59,48,.35); background:rgba(255,59,48,.08); }

.kpi { border-radius:20px; padding:22px; background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm); }
.kpi .value { font-size:38px; font-weight:750; letter-spacing:-.04em; margin-top:6px; }
.kpi .label { color:var(--muted); font-size:13px; }

.login-page { min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); }
.login-card { width:min(520px,100%); padding:34px; background:var(--surface); border:1px solid var(--line); border-radius:32px; box-shadow:var(--shadow); backdrop-filter:blur(20px); }
.brand-mark { width:54px; height:54px; border-radius:18px; background:#000; color:#fff; display:grid; place-items:center; font-weight:800; margin-bottom:22px; }
.segmented { display:flex; gap:4px; background:rgba(0,0,0,.06); padding:4px; border-radius:14px; margin:22px 0; }
.segmented button { flex:1; border:0; background:transparent; padding:10px; border-radius:10px; color:var(--muted); font-weight:700; }
.segmented button.active { background:var(--surface-solid); color:var(--text); box-shadow:0 2px 8px rgba(0,0,0,.06); }

.toast-root { position:fixed; right:24px; top:24px; z-index:500; display:flex; flex-direction:column; gap:10px; width:min(360px, calc(100vw - 48px)); }
.toast { display:flex; gap:12px; align-items:flex-start; background:rgba(28,28,30,.92); color:#fff; border-radius:16px; padding:14px 16px; box-shadow:0 18px 45px rgba(0,0,0,.2); backdrop-filter:blur(18px); animation:toastIn .25s ease; }
.toast.success .dot { background:var(--green); }
.toast.error .dot { background:var(--red); }
.toast.warning .dot { background:var(--orange); }
.toast.info .dot { background:var(--accent); }
.toast .dot { width:9px; height:9px; border-radius:50%; margin-top:6px; flex:none; }
.toast .title { font-weight:700; font-size:13px; }
.toast .message { opacity:.85; font-size:12px; line-height:1.45; margin-top:2px; }
@keyframes toastIn { from{opacity:0; transform:translateY(-8px) scale(.98)} to{opacity:1; transform:none} }

.empty { padding:50px 20px; text-align:center; color:var(--muted); }
.divider { height:1px; background:var(--line); margin:20px 0; }
.profile-row { display:flex; align-items:center; gap:14px; }
.avatar { width:48px; height:48px; border-radius:16px; background:#111; color:#fff; display:grid; place-items:center; font-weight:800; }
.list { display:flex; flex-direction:column; gap:10px; }
.list-item { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 16px; border:1px solid var(--line); border-radius:16px; background:rgba(255,255,255,.7); }

.awareness-article { scroll-margin-top:30px; }
.article-card { padding:24px; }
.article-card + .article-card { margin-top:14px; }
.article-card p { margin-top:10px; line-height:1.62; color:#444; }
.article-card ul { margin:10px 0 0 20px; color:#444; line-height:1.65; }

.upload-row { display:flex; gap:10px; flex-wrap:wrap; }

.auth-form { margin-top:18px; }
.login-title{font-size:26px;line-height:1.12;letter-spacing:-.03em;margin:0 0 4px;font-weight:750;}
.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:0;margin-top:14px;padding:4px;background:rgba(0,0,0,.045);border:1px solid var(--line);border-radius:16px;}
.auth-actions .auth-action:first-child{border-right:1px solid var(--line);border-radius:12px 0 0 12px;}
.auth-actions .auth-action:last-child{border-radius:0 12px 12px 0;}
.auth-action{min-height:46px;border:0;border-radius:12px;background:transparent;color:var(--text);font-weight:700;padding:0 14px;transition:transform .2s ease,background .2s ease,box-shadow .2s ease;}
.auth-action:hover{background:var(--surface-solid);box-shadow:0 4px 14px rgba(0,0,0,.08);transform:translateY(-1px);}
.auth-action:active{transform:scale(.98);}
.auth-action-full{grid-column:1/-1;}
.auth-foot { margin-top:18px; font-size:13px; text-align:center; color:var(--muted); }
.auth-foot button { border:0; background:transparent; color:var(--accent); font-weight:700; }

@media (max-width: 1100px) {
  .hero { grid-template-columns:1fr; }
  .card-grid { grid-template-columns:1fr; }
  .grid-4 { grid-template-columns:repeat(2,minmax(0,1fr)); }
}

@media (max-width: 760px) {
  :root { --nav-space: 0px; }
  .view { padding:22px 18px 180px; }
  .nav-dock { display:none; }
  .mobile-nav { position:fixed; left:8px; right:8px; bottom:calc(env(safe-area-inset-bottom) + 10px); z-index:80; display:flex; align-items:flex-end; gap:4px; }
  .mobile-nav .nav-pill { flex:1 1 auto; min-width:0; max-width:calc(100vw - 72px); overflow:hidden; scrollbar-width:none; flex-direction:row; justify-content:space-between; gap:0; padding:5px; border-radius:28px; background:rgba(255,255,255,.78); border:1px solid rgba(0,0,0,.08); }
  .mobile-nav .nav-pill::-webkit-scrollbar { display:none; }
  .mobile-nav .nav-item { flex:1 1 54px; width:54px; min-width:54px; height:68px; padding:0 3px; border-radius:28px; gap:3px; flex-direction:column; justify-content:center; align-items:center; }
  .mobile-nav .nav-item .nav-icon, .mobile-nav .nav-item .gear-icon { width:24px; height:24px; }
  .mobile-nav .nav-text { font-size:9.5px; line-height:1.05; white-space:nowrap; max-width:44px; text-align:center; }
  .mobile-nav .nav-label { display:none; }
  .mobile-nav .search-fab { width:52px; min-width:52px; height:52px; flex:none; border-radius:50%; gap:0; margin-bottom:6px; }
  .mobile-nav .search-fab .nav-label { display:none; }
  .topbar { align-items:flex-start; }
  .hero-main { padding:26px; min-height:280px; }
  .form-grid, .grid-2, .grid-3 { grid-template-columns:1fr; }
  .search-layout { grid-template-columns:1fr; }
  .modal-backdrop { padding:10px; }
  .modal { border-radius:24px; }
  .modal-body { padding:16px; }
  .toast-root { right:12px; top:12px; width:calc(100vw - 24px); }
  .grid-4 { grid-template-columns:1fr 1fr; }
}


@media (max-width:760px){
  .login-title{font-size:24px;}
  .auth-actions{gap:8px;padding:4px;}
  .auth-action{font-size:13px;min-height:44px;padding:0 8px;}
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior:auto !important; animation:none !important; transition:none !important; }
}


/* Navigation role/responsive refinement */
.nav-dock:not(.split-nav) { gap:0; }
.nav-dock:not(.split-nav) .nav-pill { width:300px; }
.mobile-nav:not(.split-nav) .nav-pill { width:100%; max-width:none; }
.mobile-nav:not(.split-nav) { left:8px; right:8px; }

@media (min-width: 761px) {
  .view { padding-left: calc(var(--nav-space) + 52px); padding-right:52px; }
  .nav-dock.split-nav .search-fab { margin-top:2px; }
  .nav-dock:not(.split-nav) .nav-item { min-height:58px; }
}

@media (max-width: 760px) {
  :root { --nav-space: 0px; }
  .view { width:100%; max-width:none; padding:22px 14px 136px; }
  .mobile-nav { bottom:calc(env(safe-area-inset-bottom) + 10px); }
  .mobile-nav .nav-pill { min-width:0; width:100%; max-width:none; padding:5px; }
  .mobile-nav .nav-item { min-width:0; width:auto; flex:1 1 0; height:64px; padding:0 2px; }
  .mobile-nav .nav-text { font-size:clamp(9px, 2.6vw, 11px); max-width:none; }
  .mobile-nav.split-nav .nav-pill { max-width:calc(100vw - 72px); }
  .mobile-nav.split-nav { gap:6px; }
  .mobile-nav.split-nav .search-fab { width:52px; min-width:52px; height:52px; }
  .hero-main, .hero-side, .card, .table-card { width:100%; }
  .hero { gap:14px; }
  .card-grid { gap:14px; }
  .topbar { gap:10px; margin-bottom:20px; }
  h1 { font-size:clamp(32px, 9vw, 44px); }
  h2 { font-size:clamp(24px, 7vw, 32px); }
  .lead { font-size:16px; }
}

/* Dark appearance */
body.dark {
  --bg: #000;
  --surface: rgba(28,28,30,.78);
  --surface-solid: #1c1c1e;
  --surface-soft: rgba(28,28,30,.6);
  --text: #f5f5f7;
  --muted: #98989d;
  --line: rgba(255,255,255,.10);
  --accent-soft: rgba(10,132,255,.18);
  --shadow: 0 18px 50px rgba(0,0,0,.45);
  --shadow-sm: 0 8px 25px rgba(0,0,0,.28);
}
body.dark input, body.dark select, body.dark textarea { background:rgba(28,28,30,.88); color:var(--text); }
body.dark .article-card p, body.dark .article-card ul { color:#d1d1d6; }
body.dark .nav-pill, body.dark .search-fab { background:rgba(28,28,30,.70); border-color:rgba(255,255,255,.10); }
body.dark .modal, body.dark .modal-head { background:rgba(28,28,30,.94); }

/* Utility navigation: fixed bottom-center control with square, all-visible expansion */
.utility-nav{
  position:fixed;
  left:50%;
  top:auto;
  bottom:calc(env(safe-area-inset-bottom) + 22px);
  transform:translateX(-50%);
  z-index:90;
  width:64px;
  height:64px;
  display:block;
}
.utility-toggle{
  position:absolute;
  left:0;
  bottom:0;
  width:64px;
  height:64px;
  border:1px solid rgba(255,255,255,.76);
  border-radius:50%;
  background:rgba(255,255,255,.78);
  color:var(--text);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:var(--shadow);
  display:grid;
  place-items:center;
  transition:transform .28s var(--ease-out),background .2s ease,box-shadow .28s var(--ease-out);
  flex:none;
  z-index:3;
}
.utility-toggle:hover{transform:scale(1.03);}
.utility-toggle .utility-dots{
  width:22px;
  height:22px;
  display:grid;
  grid-template-columns:repeat(2,7px);
  grid-template-rows:repeat(2,7px);
  gap:5px;
  place-content:center;
}
.utility-toggle .utility-dots i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block;}
.utility-nav-panel{
  position:absolute;
  left:50%;
  bottom:78px;
  width:320px;
  height:320px;
  padding:10px;
  transform:translate(-50%,14px) scale(.94);
  transform-origin:bottom center;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  overflow:hidden;
  transition:transform .3s var(--spring),opacity .22s var(--ease-out),visibility 0s linear .3s;
}
.utility-nav.expanded .utility-nav-panel{
  transform:translate(-50%,0) scale(1);
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  transition:transform .3s var(--spring),opacity .22s var(--ease-out),visibility 0s linear 0s;
}
.utility-nav .nav-pill{
  width:100%;
  height:100%;
  min-width:0;
  max-width:none;
  padding:12px;
  display:grid;

}
.utility-nav .nav-item,
.utility-nav .utility-switch{

  padding:8px 5px;

.utility-nav .nav-text{display:block;font-size:12px;line-height:1.08;font-weight:650;text-align:center;white-space:normal;overflow-wrap:anywhere;}
.utility-nav .nav-label{display:none;}
.utility-nav .nav-switch-text{margin:0;}
.utility-nav .utility-switch{
  border:0;
  background:transparent;
  color:var(--text);
  font-weight:700;
  white-space:normal;
  font-size:12px;

}

<body>
  <div id="app" class="app"></div>
  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite" aria-atomic="true"></div>
  <script>
(function(){
  'use strict';

  const STORAGE = 'cyber_portal_v1';
  const THEME_KEY = 'cyber_portal_theme';
  const SESSION_KEY = 'cyber_portal_session';

  const awareness = [
    {id:'phishing', title:'Phishing & Suspicious Links', keywords:['phishing','suspicious link','fake message','email','sms'],
      desc:'Recognize deceptive messages and links that try to steal sensitive information.',
      body:'Phishing is an attempt to trick a person into revealing sensitive information by pretending to be a trusted person, company, service, or institution.',
      tips:['Be cautious with unexpected emails, SMS messages, social-media messages, and links.','Check the sender and the website address before entering credentials.','Do not enter passwords, OTPs, card details, or banking information on a page reached through a suspicious link.','Do not assume a message is genuine merely because it uses a familiar logo or name.','When in doubt, open the organization\'s official website or app directly instead of using the received link.']},
    {id:'upi', title:'UPI & Online Payment Safety', keywords:['upi','payment','qr','otp','online payment'],
      desc:'Learn how payment requests, QR tricks, impersonation, and remote-access scams work.',
      body:'Online payment fraud can involve fake payment requests, impersonation, QR-code tricks, remote-access scams, and requests for confidential banking information.',
      tips:['Never share your UPI PIN or OTP with another person.','Remember that entering a UPI PIN is generally used to authorize a payment, not to receive money.','Verify the recipient and amount before approving a transaction.','Do not install remote-access applications because an unknown caller asks you to.','If an unauthorized transaction occurs, contact the relevant bank or payment service promptly and preserve transaction evidence.']},
    {id:'passwords', title:'Password & Account Security', keywords:['password','security pin','mfa','authentication','account'],
      desc:'Protect your important online accounts with stronger authentication habits.',
      body:'Strong account security reduces the risk of unauthorized access to email, social-media, financial, and other online accounts.',
      tips:['Use long, unique passwords or passphrases for important accounts.','Do not reuse the same password across multiple important services.','Enable multi-factor authentication where available.','Never share passwords, security PINs, or authentication codes with others.','Review account recovery information and security settings periodically.']},
    {id:'social', title:'Social Media Safety', keywords:['social media','instagram','whatsapp','facebook','harassment','fake profile'],
      desc:'Reduce the risk of impersonation, phishing, harassment, malicious links, and account takeover.',
      body:'Social-media accounts can be targeted through impersonation, phishing, fake profiles, harassment, malicious links, and account takeover attempts.',
      tips:['Use privacy settings appropriate to the information you want to share.','Avoid publishing sensitive personal information publicly.','Be careful when accepting requests from unknown accounts.','Do not share authentication codes or recovery links.','Block and report suspicious or abusive accounts and preserve evidence when necessary.']},
    {id:'identity', title:'Identity Theft & Impersonation', keywords:['identity theft','impersonation','personal information','id'],
      desc:'Understand how personal information can be misused for impersonation or unauthorized access.',
      body:'Identity theft occurs when someone uses another person\'s personal information without authorization, often to impersonate them or gain access to services.',
      tips:['Limit the amount of personal information shared publicly.','Treat identity documents and personal identifiers as sensitive information.','Be cautious when someone urgently asks for personal or financial details.','Monitor important accounts for unusual activity.','Report suspected misuse and keep copies of relevant evidence.']},
    {id:'cyberbullying', title:'Cyberbullying, Harassment & Online Abuse', keywords:['cyberbullying','harassment','abuse','threat','online abuse'],
      desc:'Know how to respond to repeated threats, abusive messages, impersonation, or harmful content.',
      body:'Cyberbullying and online harassment can include repeated threats, abusive messages, impersonation, humiliation, or harmful content distributed through digital platforms.',
      tips:['Do not respond impulsively to threatening or abusive messages.','Use platform tools to block and report abusive accounts.','Preserve screenshots, messages, URLs, usernames, and dates when evidence is needed.','Review privacy settings and limit unwanted contact.','Seek help from a trusted person or appropriate authority when there is a serious threat or continuing abuse.']},
    {id:'malware', title:'Malware & Unsafe Downloads', keywords:['malware','apk','download','virus','unsafe file'],
      desc:'Learn how malicious software can disrupt devices, steal data, or perform unauthorized actions.',
      body:'Malware is malicious software designed to disrupt devices, steal information, spy on users, or perform unauthorized actions.',
      tips:['Download software from trusted and legitimate sources.','Avoid pirated applications, unknown APKs, and suspicious attachments.','Keep the operating system, browser, and security software updated.','Do not disable security protections simply because an unknown website or application requests it.','Be cautious with files received unexpectedly through email or messaging apps.']},
    {id:'fake-sites', title:'Fake Websites, Apps & Online Scams', keywords:['fake website','fake app','scam','support scam','domain'],
      desc:'Spot websites, apps, advertisements, or support accounts that imitate legitimate services.',
      body:'Fraudsters may create websites, applications, advertisements, or support accounts that imitate legitimate services.',
      tips:['Check the domain name carefully for unusual spelling or extra characters.','Do not trust claims based only on logos, branding, or urgent language.','Avoid making payments through unknown websites.','Use official app stores and official websites whenever possible.','Verify customer-support contact information independently.']},
    {id:'wifi', title:'Public Wi-Fi & Device Safety', keywords:['wifi','public wifi','device security','screen lock'],
      desc:'Reduce privacy and security risks when using shared networks or devices in public places.',
      body:'Public or shared networks can create additional privacy and security risks, especially when users access sensitive services.',
      tips:['Avoid performing highly sensitive transactions on untrusted networks when possible.','Use HTTPS websites and keep your device software updated.','Turn off automatic connection to unknown Wi-Fi networks.','Do not leave devices unlocked in public places.','Use screen locks and device security features.']},
    {id:'after-crime', title:'What to Do After a Cybercrime', keywords:['after cybercrime','victim','evidence','report','recovery'],
      desc:'Immediate steps for preserving evidence, securing accounts, and using appropriate reporting channels.',
      body:'A victim should act quickly, preserve evidence, and use appropriate reporting or support channels rather than deleting potentially useful information.',
      tips:['Stay calm and stop interacting with the suspected attacker.','Preserve screenshots, messages, transaction records, URLs, usernames, phone numbers, and other relevant evidence.','Secure affected accounts by changing passwords and enabling additional security where appropriate.','Contact the relevant bank, payment provider, platform, or service if an account or transaction is affected.','Use the appropriate official cybercrime reporting channel or law-enforcement process for the situation.','Keep the complaint/reference number and follow its progress through the portal when applicable.']},
    {id:'social-engineering', title:'Social Engineering & Scam Calls', keywords:['social engineering','scam call','phone scam','impersonation call','urgent call'],
      desc:'Recognize manipulation tactics used in calls and messages that create urgency, fear, or false trust.',
      body:'Social engineering uses human interaction and psychological pressure to persuade people to reveal information, approve transactions, install software, or take an unsafe action.',
      tips:['Be cautious when someone creates urgency or threatens immediate consequences.','Do not share OTPs, passwords, UPI PINs, security codes, or confidential documents during unsolicited calls.','End the call and contact the organization through an independently verified official number.','Do not install remote-access software because an unknown caller asks you to.','Report suspected scams and preserve the call details, messages, numbers, and transaction records.']},
    {id:'device-browser', title:'Device & Browser Security', keywords:['device security','browser security','updates','software update','browser'],
      desc:'Keep phones and computers safer through updates, secure settings, and careful browser habits.',
      body:'Devices and browsers are common targets for malicious software, unsafe extensions, fraudulent downloads, and account theft.',
      tips:['Install operating-system and browser updates from trusted sources.','Use a screen lock and enable device security features.','Review installed browser extensions and remove those you do not need or recognize.','Avoid installing software from unknown websites or unofficial sources.','Back up important data and use reputable security protections where appropriate.']},
  ];

  const quizQuestions = [
    {q:'You receive a message asking you to click a link and enter your bank password immediately. What should you do?', options:['Click the link and enter the password','Forward the message to friends','Avoid the link and verify the request through the official bank website/app','Reply with your password'], answer:2, explanation:'Suspicious links and urgent requests are common phishing techniques. Verify through an official channel instead.'},
    {q:'Someone says they need your UPI PIN to send money to your account. What should you do?', options:['Share the UPI PIN','Share only half of the PIN','Never share the UPI PIN','Send the PIN through email'], answer:2, explanation:'A UPI PIN is confidential and should not be shared with another person.'},
    {q:'Which is the safest password practice?', options:['Use the same password everywhere','Use your name and birth year','Use a unique, strong password for important accounts','Share your password with a friend'], answer:2, explanation:'Unique, strong passwords reduce the impact of a password compromise on other accounts.'},
    {q:'You receive an unexpected attachment from an unknown sender. What is the safest response?', options:['Open it immediately','Download it and disable security software','Verify the sender and avoid opening it if it is suspicious','Forward it to another person'], answer:2, explanation:'Unexpected attachments can contain malicious files. Verify before opening anything.'},
    {q:'What should you do if someone is repeatedly harassing you online?', options:['Delete all evidence immediately','Preserve evidence and use blocking/reporting tools','Share your password with them','Send them your personal documents'], answer:1, explanation:'Preserving evidence can help with reporting, while blocking and reporting can reduce further contact.'},
    {q:'Which action is safest when accessing an important service?', options:['Use a link from an unknown message','Search for or directly open the service\'s official website/app','Use a random website with the same logo','Enter credentials into any page that asks for them'], answer:1, explanation:'Using the official website or app directly reduces the risk of being redirected to a fake login page.'},
    {q:'You notice an unauthorized online transaction. What should you do?', options:['Ignore it','Delete all transaction messages','Contact the relevant bank/payment provider promptly and preserve evidence','Share your OTP publicly'], answer:2, explanation:'Quick reporting and preservation of transaction evidence can help with response and investigation.'},
    {q:'Which is a warning sign of a possible fake website?', options:['Carefully checked official domain','Normal navigation','Unusual spelling or a suspicious domain name','Official app-store listing'], answer:2, explanation:'Look carefully at the domain name and other signs before entering sensitive information.'},
    {q:'What should you do with a suspicious social-media account pretending to be someone you know?', options:['Send it personal information','Trust it because the profile photo looks familiar','Verify the person\'s identity through another trusted channel and report the fake account if appropriate','Give it your OTP'], answer:2, explanation:'Impersonation accounts can be used for fraud. Verify identity independently.'},
    {q:'What is useful evidence to preserve after a cybercrime incident?', options:['Only your memory','Screenshots, messages, transaction details, URLs, usernames, dates, and other relevant records','Nothing','Only the attacker\'s profile picture'], answer:1, explanation:'A detailed evidence record can help explain what happened and support the reporting/investigation process.'}
  ];

  const STATUS_OPTIONS = ['Pending','In Progress','Solved','Dismissed'];

  const DEFAULT = {
    users: [],
    officers: [
      {id:'off-omkar', name:'Omkar Chopade', post:'Cybercrime Investigation Officer', officerId:'OFF-001', username:'omkar', email:'omkar@cybercrime.gov.in', mobile:'9873412056', address:'Cyber Crime Branch, 3rd Floor, Government Polytechnic, Pune', password:'Officer@123', pin:'123456', active:true},
      {id:'off-shreetej', name:'Shreetej Rokade', post:'Cybercrime Investigation Officer', officerId:'OFF-002', username:'shreetej', email:'shreetej@cybercrime.gov.in', mobile:'8765093142', address:'Cyber Crime Branch, 3rd Floor, Government Polytechnic, Pune', password:'Officer@123', pin:'123456', active:true},
      {id:'off-pranjal', name:'Pranjal Shinde', post:'Cybercrime Investigation Officer', officerId:'OFF-003', username:'pranjal', email:'pranjal@cybercrime.gov.in', mobile:'7652984310', address:'Cyber Crime Branch, 3rd Floor, Government Polytechnic, Pune', password:'Officer@123', pin:'123456', active:true},
      {id:'off-siddharth', name:'Siddharth Shinde', post:'Cybercrime Investigation Officer', officerId:'OFF-004', username:'siddharth', email:'siddharth@cybercrime.gov.in', mobile:'9347152608', address:'Cyber Crime Branch, 3rd Floor, Government Polytechnic, Pune', password:'Officer@123', pin:'123456', active:true}
    ],
    admins: [{id:'admin-1', name:'Administrator', username:'admin', email:'admin@example.local', password:'Admin@123', pin:'999999', active:true}],
    complaints: [],
    awareness,
    quizResults: [],
    settings: {theme:'light'}
  };

  function clone(obj){ return JSON.parse(JSON.stringify(obj)); }
  function normalizeStatus(status){
    if(STATUS_OPTIONS.includes(status)) return status;
    if(status==='Registered'||status==='Assigned'||status==='Under Review') return 'Pending';
    if(status==='Under Process'||status==='Investigation'||status==='Action Taken') return 'In Progress';
    if(status==='Resolved'||status==='Closed') return 'Solved';
    return 'Pending';
  }
  function normalizeDB(db){
    db.users = Array.isArray(db.users) ? db.users : [];
    db.officers = Array.isArray(db.officers) ? db.officers : [];
    db.admins = Array.isArray(db.admins) ? db.admins : clone(DEFAULT.admins);
    db.complaints = Array.isArray(db.complaints) ? db.complaints : [];
    db.quizResults = Array.isArray(db.quizResults) ? db.quizResults : [];
    db.settings = db.settings || {theme:'light'};
    db.awareness = Array.isArray(db.awareness) ? db.awareness : clone(awareness);
    // Replace/refresh the built-in awareness catalog while preserving any administrator-created articles.
    const builtInById = Object.fromEntries(awareness.map(a=>[a.id,a]));
    const custom = db.awareness.filter(a=>!builtInById[a.id]);
    db.awareness = [...clone(awareness), ...custom];
    db.users.forEach(u=>{u.active = u.active!==false; u.address=u.address||''; u.mobile=u.mobile||'';});
    db.officers.forEach(o=>{o.active=o.active!==false; o.address=o.address||''; o.mobile=o.mobile||''; o.post=o.post||'Cybercrime Investigation Officer';});
    // Keep the four built-in officer profiles consistent across fresh and previously stored demo data.
    const builtInOfficerProfiles = {
      'off-omkar': {username:'omkar', email:'omkar@cybercrime.gov.in', mobile:'9873412056', password:'Officer@123', pin:'123456', address:'Cyber Crime Branch, 3rd Floor, Government Polytechnic, Pune'},
      'off-shreetej': {username:'shreetej', email:'shreetej@cybercrime.gov.in', mobile:'8765093142', password:'Officer@123', pin:'123456', address:'Cyber Crime Branch, 3rd Floor, Government Polytechnic, Pune'},
      'off-pranjal': {username:'pranjal', email:'pranjal@cybercrime.gov.in', mobile:'7652984310', password:'Officer@123', pin:'123456', address:'Cyber Crime Branch, 3rd Floor, Government Polytechnic, Pune'},
      'off-siddharth': {username:'siddharth', email:'siddharth@cybercrime.gov.in', mobile:'9347152608', password:'Officer@123', pin:'123456', address:'Cyber Crime Branch, 3rd Floor, Government Polytechnic, Pune'}
    };
    db.officers.forEach(o=>{
      const profile=builtInOfficerProfiles[o.id];
      if(profile) Object.assign(o, profile);
    });
    db.admins.forEach(a=>{a.active=a.active!==false; a.address=a.address||''; a.mobile=a.mobile||''; a.post=a.post||'Administrator';});
    db.complaints.forEach(c=>{
      c.status = normalizeStatus(c.status);
      c.history = Array.isArray(c.history) ? c.history : [{status:c.status,finding:'',remarks:'Complaint recorded.',at:c.createdAt||new Date().toISOString()}];
      c.history = c.history.map(h=>({...h,status:normalizeStatus(h.status)}));
      c.evidence = Array.isArray(c.evidence) ? c.evidence : [];
      c.assignedOfficerId = c.assignedOfficerId || null;
      c.updatedAt = c.updatedAt || c.createdAt || new Date().toISOString();
    });
    return db;
  }
  function loadDB(){
    let db;
    try { db = JSON.parse(localStorage.getItem(STORAGE) || 'null'); } catch(e){ db=null; }
    if(!db){
      try { db = JSON.parse(localStorage.getItem('cyber_portal_v1') || 'null'); } catch(e){ db=null; }
    }
    if(!db) db=clone(DEFAULT);
    db=normalizeDB(db);
    localStorage.setItem(STORAGE, JSON.stringify(db));
    return db;
  }
  function saveDB(db){ localStorage.setItem(STORAGE, JSON.stringify(db)); }
  function loadSession(){ try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(e){return null;} }
  function saveSession(s){ localStorage.setItem(SESSION_KEY, JSON.stringify(s)); }
  function clearSession(){ localStorage.removeItem(SESSION_KEY); }

  const loadedSession=loadSession();
  const state={ db:loadDB(), session:loadedSession, page:loadedSession?.role==='admin'?'dashboard':'home', userRole:'user', history:[] };
  document.body.classList.toggle('dark', (state.db.settings?.theme||'light')==='dark');

  function esc(value){ return String(value??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
  function uid(prefix){ return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`; }
  function fmtDate(v){ return new Date(v).toLocaleString(undefined,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
  function complaintId(){ return `CYB-${new Date().getFullYear()}-${String(state.db.complaints.length+1).padStart(5,'0')}`; }
  function currentAccount(){
    if(!state.session) return null;
    const group = state.session.role==='user'?'users':state.session.role==='officer'?'officers':'admins';
    return state.db[group].find(x=>x.id===state.session.id)||null;
  }
  function initials(name=''){ return name.split(' ').map(s=>s[0]).slice(0,2).join('').toUpperCase()||'?'; }

  function icon(name){
    const symbols={home:'home',report:'report_problem',track:'timeline',awareness:'shield',user:'person',settings:'settings',search:'search',chart:'bar_chart',users:'group',officer:'verified_user',plus:'add',switch:'switch_account',info:'info',logout:'logout',lock:'lock',sun:'light_mode',moon:'dark_mode',check:'check',close:'close',back:'arrow_back',eye:'visibility',play:'play_arrow',edit:'edit',trash:'delete',paperclip:'attach_file'};
    return `<span class="material-symbols-rounded nav-icon" aria-hidden="true">${symbols[name]||'info'}</span>`;
  }

  function navForRole(role){
    /* Five icon items maximum. Switch Account is a text action inside the same expandable utility bar. */
    if(role==='user') return [
      ['home','Home','home'],['report','Report','report'],['track','Track','track'],['awareness','Awareness','awareness'],['settings','Settings','settings']
    ];
    if(role==='officer') return [
      ['dashboard','Dashboard','chart'],['users','Users','users'],['mine','Cases','track'],['update','Update','edit'],['settings','Settings','settings']
    ];
    return [
      ['dashboard','Dashboard','chart'],['complaints','Complaints','report'],['allocation','Allocate','plus'],['users','Users','users'],['settings','Settings','settings']
    ];
  }
  function rootPageForRole(role){ return role==='admin' ? 'dashboard' : 'home'; }
  function go(page, fromPopState=false){
    if(page==='awareness' && state.session?.role!=='user') page='dashboard';
    if(page===state.page && !fromPopState) return;
    state.history = Array.isArray(state.history) ? state.history : [];
    if(!fromPopState){
      state.history.push(state.page);
      try { window.history.pushState({portalPage:page},'',`#${encodeURIComponent(page)}`); } catch(e) {}
    }
    state.page=page; render(); window.scrollTo({top:0,behavior:'smooth'});
  }
  function goBack(fromPopState=false){
    state.history = Array.isArray(state.history) ? state.history : [];
    if(!fromPopState){
      if(state.history.length){
        try { window.history.back(); return; } catch(e) {}
        state.page=state.history.pop();
      } else { state.page=rootPageForRole(state.session?.role); }
    } else if(state.history.length){
      state.page=state.history.pop();
    } else {
      state.page=rootPageForRole(state.session?.role);
    }
    render(); window.scrollTo({top:0,behavior:'smooth'});
  }

  function showToast(message, type='success', title=''){ 
    const root=document.getElementById('toast-root');
    const el=document.createElement('div'); el.className=`toast ${type}`;
    el.innerHTML=`<span class="dot"></span><div><div class="title">${esc(title||({success:'Success',error:'Error',warning:'Warning',info:'Info'}[type]||'Notice'))}</div><div class="message">${esc(message)}</div></div>`;
    root.appendChild(el); setTimeout(()=>{el.classList.add('toast-leave'); setTimeout(()=>el.remove(),200);},3800);
  }

  function openModal(title, body, options={}){
    const root=document.getElementById('modal-root');
    root.innerHTML=`<div class="modal-backdrop" data-close-modal>
      <div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
        <div class="modal-head"><div><div class="eyebrow">${esc(options.eyebrow||'')}</div><h3>${esc(title)}</h3></div><button class="modal-close" data-modal-close aria-label="Close">${icon('close')}</button></div>
        <div class="modal-body">${body}</div>
      </div>
    </div>`;
    root.querySelector('[data-modal-close]').onclick=()=>closeModal();
    root.querySelector('[data-close-modal]').addEventListener('click',e=>{if(e.target.dataset.closeModal!==undefined) closeModal();});
    return root.querySelector('.modal');
  }
  function closeModal(){ document.getElementById('modal-root').innerHTML=''; }

  function render(){
    state.db=loadDB();
    document.body.classList.toggle('dark',(state.db.settings?.theme||'light')==='dark');
    const app=document.getElementById('app');
    if(!state.session){ renderLogin(app); return; }
    renderShell(app);
  }

  function renderLogin(app){
    app.innerHTML=`<div class="login-page">
      <div class="login-card">
        <h2 class="login-title">Cybercrime Reporting & Awareness Portal</h2>
        <div class="segmented" id="login-seg">
          <button data-role="user" class="active">User</button>
          <button data-role="officer">Officer</button>
          <button data-role="admin">Administrator</button>
        </div>
        <form id="login-form" class="auth-form">
          <div class="field"><label>Username / Email / Mobile</label><input required id="login-id" autocomplete="username" /></div>
          <div class="field" style="margin-top:12px"><label>Password</label><input required type="password" id="login-password" autocomplete="current-password" /></div>
          <button class="btn btn-primary" style="width:100%;margin-top:16px">Log In</button>
        </form>

  async function collectFileData(files){
    const out=[]; for(const f of files){
      const reader=new FileReader(); const data=await new Promise(resolve=>{reader.onload=()=>resolve(reader.result); reader.readAsDataURL(f);});
      out.push({name:f.name,type:f.type,size:f.size,data});
    } return out;
  }

  function renderQuizModal(){
    let i=0, answers=Array(quizQuestions.length).fill(null), submitted=false;
    const modal=openModal('Cyber Safety Quiz',`<div id="quiz-body"></div>`);
    const body=modal.querySelector('#quiz-body');
    function draw(){
      if(submitted) return drawResult();
      const q=quizQuestions[i]; body.innerHTML=`<div class="eyebrow">QUESTION ${i+1} OF ${quizQuestions.length}</div><h3 style="margin-top:8px">${esc(q.q)}</h3><div style="margin-top:16px">${q.options.map((o,idx)=>`<button class="quiz-option ${answers[i]===idx?'selected':''}" data-opt="${idx}">${String.fromCharCode(65+idx)}. ${esc(o)}</button>`).join('')}</div><div class="btn-row" style="margin-top:18px;justify-content:space-between"><button class="btn btn-secondary" id="quiz-prev" ${i===0?'disabled':''}>Previous</button><button class="btn btn-primary" id="quiz-next">${i===quizQuestions.length-1?'Submit Quiz':'Next'}</button></div>`;
      body.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{answers[i]=Number(b.dataset.opt); draw();});
      body.querySelector('#quiz-prev').onclick=()=>{i--; draw();};
      body.querySelector('#quiz-next').onclick=()=>{ if(answers[i]===null) return showToast('Please select an answer.','warning'); if(i<quizQuestions.length-1){i++;draw();}else{submitted=true;draw();} };
    }
    function drawResult(){
      const score=answers.reduce((n,a,idx)=>n+(a===quizQuestions[idx].answer?1:0),0);
      const message=score>=9?'Excellent awareness. You demonstrate strong understanding of common cyber-safety practices.':score>=7?'Good awareness. Review the topics where you made mistakes.':score>=5?'Moderate awareness. We recommend revisiting the Awareness Portal.':'Needs improvement. Please review the cyber-safety guidance before taking the quiz again.';
      const acct=currentAccount(); state.db.quizResults.push({id:uid('quiz'),userId:acct.id,score,total:10,at:new Date().toISOString()}); saveDB(state.db);
      body.innerHTML=`<div class="card" style="text-align:center"><div class="eyebrow">YOUR RESULT</div><div style="font-size:64px;font-weight:800;letter-spacing:-.05em;margin-top:8px">${score}<span style="font-size:26px;color:var(--muted)">/10</span></div><p class="muted" style="margin-top:6px">${esc(message)}</p></div><div class="section">${quizQuestions.map((q,idx)=>`<div class="card" style="margin-top:10px"><div class="eyebrow">QUESTION ${idx+1}</div><div style="font-weight:700;margin-top:5px">${esc(q.q)}</div><div class="small" style="margin-top:8px"><strong>Correct:</strong> ${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</div><div class="helper" style="margin-top:6px">${esc(q.explanation)}</div></div>`).join('')}</div><div class="btn-row" style="margin-top:16px"><button class="btn btn-primary" id="quiz-close">Done</button></div>`;
      body.querySelector('#quiz-close').onclick=closeModal;
    }
    draw();
  }

<script>
/* Visual-only motion enhancement: one observer, one reveal style, no parallax/transform conflict. */
(function(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const selectors = '.view > .topbar, .hero-main, .hero-side, .section-head, .card, .kpi, .table-wrap, .article-card, .search-box, .search-results, .list-item';
  let observer = null;

  function decorate(){
    const nodes = Array.from(document.querySelectorAll(selectors));
    nodes.forEach(el=>el.classList.add('reveal-ready'));
    if(reduce){
      nodes.forEach(el=>el.classList.add('revealed'));
      return;
    }
    if(observer) observer.disconnect();
    observer = new IntersectionObserver(entries=>{
      entries.forEach(entry=>{
        // Replay the reveal every time the element enters the viewport.
        // Removing the class on exit lets the next downward scroll animate again.
        entry.target.classList.toggle('revealed', entry.isIntersecting);
      });
    },{threshold:.12,rootMargin:'0px 0px -6% 0px'});
    nodes.forEach(el=>observer.observe(el));
  }

  decorate();
  const app=document.getElementById('app');
  if(app){
